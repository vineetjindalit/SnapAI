<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapAI · Event capture in Delhi NCR</title>
<meta name="description" content="Book a SnapAI capturer for birthdays, anniversaries and family functions in Delhi NCR. AI auto-capture plus manual shots, instant private album on WhatsApp. From ₹99, or pick your own hours.">
<meta property="og:title" content="SnapAI · Enjoy your own celebration. We'll capture it.">
<meta property="og:description" content="Book a capturer from ₹99. AI auto-capture + manual shots, instant private album on WhatsApp. Delhi NCR.">
<meta property="og:image" content="https://jksqxvdoutwigirnqfea.supabase.co/storage/v1/object/public/site/hero-birthday.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#001C70">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section class="hero">
    <div class="wrap grid">
      <div>
        <div class="eyebrow" data-i18n="hero_eyebrow"></div>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="ctas">
          <a class="btn btn-primary" href="/book" data-i18n="cta_book"></a>
          <a class="btn btn-ghost" href="#plans" data-i18n="cta_plans"></a>
        </div>
        <div class="trust"><span data-i18n="trust_1"></span><span data-i18n="trust_2"></span><span data-i18n="trust_3"></span></div>
      </div>
      <div class="hero-photo ph" data-photo="hero-birthday" data-alt="A SnapAI capturer photographing a family birthday with a smartphone">
        <div class="badge-float"><span class="dot"></span><span data-i18n="badge_live"></span></div>
      </div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <div class="eyebrow" data-i18n="how_eyebrow"></div>
      <h2 data-i18n="how_title"></h2>
      <div class="steps" style="margin-top:22px">
        <div class="step"><h3 data-i18n="s1_t"></h3><p data-i18n="s1_p"></p></div>
        <div class="step"><h3 data-i18n="s2_t"></h3><p data-i18n="s2_p"></p></div>
        <div class="step"><h3 data-i18n="s3_t"></h3><p data-i18n="s3_p"></p></div>
        <div class="step"><h3 data-i18n="s4_t"></h3><p data-i18n="s4_p"></p></div>
      </div>
    </div>
  </section>

  <section id="plans" style="padding-top:0">
    <div class="wrap">
      <div class="eyebrow" data-i18n="plans_eyebrow"></div>
      <h2 data-i18n="plans_title"></h2>
      <p class="muted" data-i18n="plans_sub"></p>
      <div class="plans" style="margin-top:22px">
        <div class="plan std">
          <span class="tag" data-i18n="p_std"></span>
          <h3 data-i18n="p30_name"></h3>
          <div class="price">₹99 <small>· 30 min</small></div>
          <ul><li data-i18n="p30_1"></li><li data-i18n="p30_2"></li><li data-i18n="p30_3"></li></ul>
          <a class="btn btn-primary" href="/book?plan=30" data-i18n="choose"></a>
        </div>
        <div class="plan">
          <span class="tag" data-i18n="p_popular"></span>
          <h3 data-i18n="p60_name"></h3>
          <div class="price">₹199 <small>· 1 hr</small></div>
          <ul><li data-i18n="p60_1"></li><li data-i18n="p60_2"></li><li data-i18n="p60_3"></li></ul>
          <a class="btn btn-plum" href="/book?plan=60" data-i18n="choose"></a>
        </div>
        <div class="plan">
          <h3 data-i18n="p120_name" style="margin-top:28px"></h3>
          <div class="price">₹299 <small>· 2 hr</small></div>
          <ul><li data-i18n="p120_1"></li><li data-i18n="p120_2"></li><li data-i18n="p120_3"></li></ul>
          <a class="btn btn-plum" href="/book?plan=120" data-i18n="choose"></a>
        </div>
        <div class="plan">
          <h3 data-i18n="p180_name" style="margin-top:28px"></h3>
          <div class="price">₹399 <small>· 3 hr</small></div>
          <ul><li data-i18n="p180_1"></li><li data-i18n="p180_2"></li><li data-i18n="p180_3"></li></ul>
          <a class="btn btn-plum" href="/book?plan=180" data-i18n="choose"></a>
        </div>
      </div>
      <p class="muted" style="margin-top:16px;font-size:.95rem" data-i18n="p_custom_note"></p>
    </div>
  </section>

  <section class="band">
    <div class="wrap grid">
      <div>
        <div class="eyebrow" style="color:var(--marigold-2)" data-i18n="promise_eyebrow"></div>
        <h2 data-i18n="promise_title"></h2>
      </div>
      <div>
        <p data-i18n="promise_p"></p>
        <div class="areas"><span>Delhi</span><span>Gurugram</span><span>Noida</span><span>Greater Noida</span><span>Ghaziabad</span><span>Faridabad</span></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="eyebrow" data-i18n="gallery_eyebrow"></div>
      <h2 data-i18n="gallery_title"></h2>
      <div class="gallery" style="margin-top:20px">
        <div class="ph" data-photo="mehendi" data-alt="Capturer at a mehendi function"></div>
        <div class="ph" data-photo="first-birthday" data-alt="Baby's first birthday"></div>
        <div class="ph" data-photo="anniversary" data-alt="Anniversary cake cutting"></div>
        <div class="ph" data-photo="puja" data-alt="Family puja"></div>
        <div class="ph" data-photo="kids-party" data-alt="Kids at a birthday party"></div>
        <div class="ph" data-photo="elders-lunch" data-alt="Grandparents at a family lunch"></div>
        <div class="ph" data-photo="family-album" data-alt="Family viewing their album on a phone"></div>
        <div class="ph" data-photo="album-ready" data-alt="Album ready notification on a phone"></div>
        <div class="ph" data-photo="birthday-alt" data-alt="Capturer photographing a birthday cake moment"></div>
        <div class="ph" data-photo="mehendi-closeup" data-alt="Capturer photographing mehendi hands up close"></div>
        <div class="ph" data-photo="family-laughing" data-alt="Family laughing together while looking at their phone"></div>
        <div class="ph" data-photo="bubbles-kids" data-alt="Capturer photographing kids playing with bubbles"></div>
        <div class="ph" data-photo="group-formal" data-alt="Capturer photographing a formal group photo at a function"></div>
      </div>
      <p class="caption" data-i18n="illustrative"></p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap" style="display:grid;gap:28px">
      <div class="card">
        <h2 data-i18n="reviews_title"></h2>
        <p class="muted" style="margin:0" data-i18n="reviews_p"></p>
      </div>
      <div>
        <h2 data-i18n="faq_title"></h2>
        <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
        <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
        <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
        <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
        <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
      </div>
      <div class="partner-cta">
        <h2 data-i18n="pcta_title"></h2>
        <a class="btn btn-primary" href="/partners" data-i18n="pcta_btn"></a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/assets/app.js"></script>
</body>
</html>
