# Snappy v2.5 — local docker-compose stack.
#
# Three services:
#   snappy   — the Python server
#   redis    — used in Phase 4 for cross-instance session state (not yet
#              consumed by the code; reserved hook). Comment out for now.
#   nginx    — reverse proxy + TLS termination (use your own certs in prod).
#
# Start:  cd deploy && docker compose up --build
# Stop:   docker compose down
#
# For multi-instance Phase 4 deployment, scale snappy with:
#   docker compose up --scale snappy=3 -d

version: "3.9"

services:
  snappy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: snappy:v2.5
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      SNAPPY_DEVICE: cpu
      SNAPPY_LOG_LEVEL: INFO
      SNAPPY_CONTINUOUS_LEARNING: "0"
      # SNAPPY_AUTH: "1"          # uncomment to require JWT
      # SNAPPY_JWT_SECRET: change-me
    volumes:
      - ../backend/data:/app/backend/data
      - ../captures:/app/captures
      - ../albums:/app/albums
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # redis:                          # uncomment for Phase 4 multi-instance
  #   image: redis:7-alpine
  #   restart: unless-stopped
